---
- name: Setup nix flake
  ansible.builtin.import_tasks: flake.yml
  tags: nix

- name: Configure software
  # I cannot use loops with import_tasks
  ansible.builtin.include_tasks: "{{ file }}.yml"
  loop:
    - fish
    - git
    - go
    - fonts
    - hledger
    - nvim
    - tmux
  loop_control:
    loop_var: file

- name: Make symlinks
  ansible.builtin.include_tasks: link.yml
  loop:
    - name: alacritty
      path: "{{ packages_xdg_config }}/alacritty"
    - name: niri
      path: "{{ packages_xdg_config }}/niri"
    - name: nvim
      path: "{{ packages_xdg_config }}/nvim"
    - name: waybar
      path: "{{ packages_xdg_config }}/waybar"
    - name: zellij
      path: "{{ packages_xdg_config }}/zellij"
  loop_control:
    loop_var: app
