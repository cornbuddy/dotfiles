---

- name: Install swaylock-effects build dependencies
  ansible.builtin.apt:
    pkg: "{{ ubuntu_swaylock_effects_deps }}"
    state: present
  become: true

- name: Clone swaylock-effects
  ansible.builtin.git:
    repo: "{{ ubuntu_swaylock_effects_repo }}"
    dest: "{{ ubuntu_swaylock_effects_src_dir }}"
    version: "{{ ubuntu_swaylock_effects_version }}"
    force: false
    depth: 1

- name: Configure swaylock-effects build
  ansible.builtin.shell:
    cmd: >-
      rm -rf build &&
      meson setup build --prefix {{ ubuntu_swaylock_effects_prefix }}
      --sysconfdir=/etc -Dwerror=false
    executable: /usr/bin/bash
  args:
    chdir: "{{ ubuntu_swaylock_effects_src_dir }}"
  environment:
    CC: /usr/bin/gcc
  changed_when: true

- name: Build swaylock-effects
  ansible.builtin.shell:
    cmd: ninja -C build
    executable: /usr/bin/bash
  args:
    chdir: "{{ ubuntu_swaylock_effects_src_dir }}"

- name: Install swaylock-effects
  ansible.builtin.shell:
    cmd: ninja -C build install
    executable: /usr/bin/bash
  args:
    chdir: "{{ ubuntu_swaylock_effects_src_dir }}"
  become: true

- name: Create swaylock PAM service
  ansible.builtin.copy:
    dest: /etc/pam.d/swaylock
    mode: "0644"
    content: |
      #%PAM-1.0
      @include common-auth
      @include common-account
  become: true
