---
ubuntu_install_niri: true

ubuntu_swaylock_effects_install: true
ubuntu_swaylock_effects_repo: https://github.com/hboetes/swaylock-effects
ubuntu_swaylock_effects_version: master
ubuntu_swaylock_effects_src_dir: /tmp/swaylock-effects
ubuntu_swaylock_effects_prefix: /usr/local
ubuntu_swaylock_effects_deps:
  - cmake
  - meson
  - ninja-build
  - scdoc
  - libomp-dev
  - git
  - gcc
  - pkg-config
  - meson
  - libwayland-dev
  - wayland-protocols
  - libxkbcommon-dev
  - libcairo2-dev
  - libgdk-pixbuf-2.0-dev
  - libpam0g-dev
  - libcrypt-dev
  - scdoc

ubuntu_snap_packages:
  - name: alacritty
    classic: true
